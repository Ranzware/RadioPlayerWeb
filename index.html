<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MP3Islam Quran Radio — Listen to Quran Recitations 24/7</title>
    <meta name="description" content="Listen to Quran recitations 24/7 on MP3Islam Quran Radio. A clean HTML5 player powered by AzuraCast, with live now-playing metadata and PWA support.">
    <meta name="keywords" content="quran radio, mp3islam, quran recitation, islamic radio, azuracast, html5 radio player, web radio, now playing, pwa">
    <link rel="canonical" href="https://radio.mp3islam.com/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="MP3Islam Quran Radio — Listen to Quran Recitations 24/7">
    <meta property="og:description" content="Listen to Quran recitations 24/7 on MP3Islam Quran Radio. A clean HTML5 player powered by AzuraCast.">
    <meta property="og:url" content="https://radio.mp3islam.com/">
    <meta property="og:image" content="https://radio.mp3islam.com/img/cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0b2e1e">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MP3Islam Quran Radio",
        "url": "https://radio.mp3islam.com/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0" },
        "description": "Listen to Quran recitations 24/7 on MP3Islam Quran Radio. A clean HTML5 player powered by AzuraCast, with live now-playing metadata and PWA support.",
        "author": { "@type": "Person", "name": "Jailson Bezerra", "url": "https://github.com/jailsonsb2" }
    }
    </script>
    <link rel="icon" type="image/png" href="img/cover.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div class="bg" aria-hidden="true">
        <div id="bgCover"></div>
        <div class="bg-overlay"></div>
    </div>

    <button type="button" id="installPwaBtn" class="install-btn" hidden>
        <i class="fa fa-download"></i> Install app
    </button>

    <main class="app">
        <header class="masthead">
            <span id="radioName">MP3Islam Quran Radio</span>
        </header>

        <section class="player">
            <div class="artwork cover-album">
                <div id="currentCoverArt"></div>
            </div>

            <div class="player-info">
                <span class="live-badge"><span class="live-dot"></span> LIVE</span>
                <h1 id="currentSong" class="text-uppercase">Quran Recitation</h1>
                <h2 id="currentArtist" class="text-capitalize">Reciter</h2>

                <div class="controls">
                    <div class="control-cluster">
                        <div class="volume-wrap volume-control">
                            <button type="button" class="ctrl-btn volume-toggle" aria-label="Volume" title="Volume">
                                <i class="fa fa-volume-up"></i>
                            </button>
                            <div class="volume-popover" hidden>
                                <input type="range" id="volume" step="1" min="0" max="100" value="80" aria-label="Volume">
                                <span class="vol-value"><span id="volIndicator">80</span>%</span>
                            </div>
                        </div>

                        <button type="button" class="play-btn" onclick="togglePlay()" aria-label="Play or pause">
                            <i id="playerButton" class="fa fa-play"></i>
                        </button>

                        <button type="button" class="ctrl-btn lyrics" title="Lyrics" aria-label="Lyrics" hidden>
                            <i class="fa fa-music"></i>
                        </button>

                        <button type="button" class="ctrl-btn clip-toggle" title="Music video" aria-label="Music video" hidden>
                            <i class="fa fa-youtube-play"></i>
                        </button>
                    </div>
                    <span id="buttonPlay" class="sr-only" aria-live="polite">PLAY</span>
                </div>
            </div>
        </section>

        <section class="historic">
            <h2 class="section-title">Recently Played</h2>
            <div class="history-list" id="historicSong">
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Recitation</div>
                        <div class="artist">Reciter</div>
                    </div>
                </article>
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Recitation</div>
                        <div class="artist">Reciter</div>
                    </div>
                </article>
            </div>
        </section>

        
    </main>

    <script type="text/javascript" src="js/script.js"></script>
    <script>
        // Volume popover controls
        (function () {
            var wrap = document.querySelector('.volume-wrap');
            var toggle = document.querySelector('.volume-toggle');
            var popover = document.querySelector('.volume-popover');
            if (!wrap || !toggle || !popover) return;

            toggle.addEventListener('click', function () {
                popover.hidden = !popover.hidden;
            });
            document.addEventListener('click', function (event) {
                if (!wrap.contains(event.target)) popover.hidden = true;
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
</body>

</html>
